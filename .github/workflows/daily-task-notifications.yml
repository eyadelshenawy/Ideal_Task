name: Daily task notifications

on:
  schedule:
    # 05:00 UTC = 08:00 Cairo time
    - cron: "0 5 * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call the notifications endpoint
        run: |
          curl --fail --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notify"
