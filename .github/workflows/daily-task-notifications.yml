name: Daily task notifications

on:
  # No longer scheduled here (Eyad, 1 Nov 2026): GitHub ran it hours late
  # (e.g. 14:33 instead of 09:00 Cairo). cron-job.org now calls
  # /api/cron/notify at 09:00 Cairo, Sunday-Thursday, with the same
  # Authorization header. Run this by hand (Actions → Run workflow) if needed.
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Call the notifications endpoint
        env:
          TRIGGER: ${{ github.event.schedule }}
        run: |
          # Decide by which cron fired, not by the current clock, so a
          # delayed GitHub trigger can never send the emails twice.
          if [ -n "$TRIGGER" ]; then
            OFFSET=$(TZ=Africa/Cairo date +%z)
            if [ "$OFFSET" = "+0300" ]; then WANT="0 6 * * 0-4"; else WANT="0 7 * * 0-4"; fi
            if [ "$TRIGGER" != "$WANT" ]; then
              echo "Skipping: this trigger ($TRIGGER) isn't 09:00 Cairo today (offset $OFFSET)."
              exit 0
            fi
          fi
          curl --fail --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/notify"
