name: Keep Render instance warm

# No longer scheduled (Eyad, 30 Oct 2026): the free Render instance-hours
# ran out at the end of October, shared with the other IDEAL apps on the
# same account. The app now sleeps after ~15 idle minutes and wakes on the
# first visit (~1 minute). Run this by hand (Actions → Run workflow) to
# wake it before a demo.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it warm
        run: curl --fail --max-time 60 "${{ secrets.APP_URL }}/login"
