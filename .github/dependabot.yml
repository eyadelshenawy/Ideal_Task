version: 2
updates:
  # Weekly check for outdated or vulnerable npm packages. Minor and patch
  # bumps arrive together in one PR so it stays easy to review; major
  # versions come as their own PRs because they can need code changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "06:00"
      timezone: Africa/Cairo
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
